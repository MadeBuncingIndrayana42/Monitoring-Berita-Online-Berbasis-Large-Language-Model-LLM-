# ============================================
# Netlify Configuration - Media Monitoring
# ============================================

[build]
  # Jalankan script build untuk generate config.js dari env vars
  command = "node build-config.js"
  # Folder yang akan di-publish (root project ini)
  publish = "."

# Redirect semua halaman ke file HTML yang sesuai
[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
