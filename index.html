<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dashboard Monitoring Media - Sistem Analisis Sentimen PR PT Pupuk Sriwidjaja Palembang">
    <title>Dashboard - PR Media Monitoring</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>

    <!-- Sidebar Overlay (Mobile) -->
    <div class="sidebar-overlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- Top Bar -->
    <header class="topbar" id="topbar"></header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Stat Cards -->
        <div class="stats-grid" id="stats-grid">
            <div class="stat-card">
                <div class="stat-card-header">
                    <span class="stat-card-title">Total Berita</span>
                    <div class="stat-card-icon blue">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"></path></svg>
                    </div>
                </div>
                <div class="stat-card-value">
                    <span class="stat-card-number" id="stat-total">--</span>
                    <span class="stat-card-change up" id="stat-total-change">
                        <svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 15l7-7 7 7"></path></svg>
                        <span id="stat-total-pct">--%</span>
                    </span>
                </div>
                <div class="stat-card-bar">
                    <div class="stat-card-bar-fill blue" id="stat-total-bar" style="width: 0%"></div>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-card-header">
                    <span class="stat-card-title">Sentimen Positif</span>
                    <div class="stat-card-icon green">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                    </div>
                </div>
                <div class="stat-card-value">
                    <span class="stat-card-number" id="stat-positive">--</span>
                    <span class="stat-card-percentage" id="stat-positive-pct">--% Total</span>
                </div>
                <div class="stat-card-bar">
                    <div class="stat-card-bar-fill green" id="stat-positive-bar" style="width: 0%"></div>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-card-header">
                    <span class="stat-card-title">Sentimen Negatif</span>
                    <div class="stat-card-icon red">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                </div>
                <div class="stat-card-value">
                    <span class="stat-card-number" id="stat-negative">--</span>
                    <span class="stat-card-percentage" id="stat-negative-pct">--% Total</span>
                </div>
                <div class="stat-card-bar">
                    <div class="stat-card-bar-fill red" id="stat-negative-bar" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- Filter Bar -->
        <div class="filter-bar">
            <div class="search-input-wrapper">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <input type="text" class="search-input" id="search-input" placeholder="Cari berita...">
            </div>
            <div class="filter-group">
                <span class="filter-label">Waktu:</span>
                <select class="filter-select" id="filter-time">
                    <option value="Semua">Semua Waktu</option>
                    <option value="Minggu">7 Hari Terakhir</option>
                    <option value="Bulan">30 Hari Terakhir</option>
                    <option value="Tahun">Tahun Ini</option>
                </select>
            </div>
            <div class="filter-group">
                <span class="filter-label">Filter Sentimen:</span>
                <select class="filter-select" id="filter-sentiment">
                    <option value="Semua">Semua</option>
                    <option value="Positif">Positif</option>
                    <option value="Netral">Netral</option>
                    <option value="Negatif">Negatif</option>
                </select>
            </div>
            <button class="btn btn-primary" id="btn-filter">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
                Terapkan
            </button>
        </div>

        <!-- News Cards Grid -->
        <div class="news-grid" id="news-container">
            <div class="loading-state" style="grid-column: 1 / -1;">
                <div class="loading-spinner"></div>
                <p>Memuat data berita dari server...</p>
            </div>
        </div>

        <!-- News Pagination -->
        <div class="news-pagination" id="news-pagination" style="display: none;">
            <span class="news-pagination-info" id="news-pagination-info"></span>
            <div class="pagination">
                <button class="pagination-btn" id="news-prev-btn" disabled>
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    Sebelumnya
                </button>
                <div class="pagination-pages" id="news-pagination-pages"></div>
                <button class="pagination-btn" id="news-next-btn">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    Berikutnya
                </button>
            </div>
        </div>

        <!-- Footer -->
        <footer class="main-footer">
            <p>&copy; 2026 PT Pusri Palembang. Seluruh Hak Cipta Dilindungi. Sistem Monitoring Media Digital v2.4.0</p>
        </footer>
    </main>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js?v=2.4.2"></script>
    <script src="js/dashboard.js?v=2.4.2"></script>
</body>
</html>
